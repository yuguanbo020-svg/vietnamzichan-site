<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布越南资产与合作需求｜VietnamZiChan</title><meta name="description" content="发布越南厂房、工业土地、仓库、酒店、房产、合作项目和采购需求。"><link rel="canonical" href="https://vietnamzichan.com/publish/"><style>body{margin:0;font-family:Arial,"Noto Sans SC",sans-serif;background:#f5f7f6;color:#17211f}.wrap{max-width:900px;margin:auto;padding:0 18px}header{background:#063b35;color:#fff;padding:46px 0}form{background:#fff;border:1px solid #dce4e1;border-radius:16px;padding:24px;margin:28px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin-bottom:14px;font-weight:600}input,select,textarea{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #cfdad6;border-radius:9px;font:inherit}textarea{min-height:120px}button{background:#063b35;color:#fff;border:0;padding:12px 18px;border-radius:9px;font-weight:700}.note{font-size:13px;color:#66736f}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><p><a style="color:white" href="/">← VietnamZiChan</a></p><h1>发布资产 / 发布需求 / 寻找合作</h1><p>第一版先收集需求结构；真实联系方式与后台提交接口接入后启用正式提交。</p></div></header><main class="wrap"><form id="lead"><div class="row"><label>需求类型<select><option>找厂房</option><option>找工业土地</option><option>找仓库</option><option>找酒店/商业资产</option><option>出售/出租资产</option><option>寻找中国合作</option><option>寻找越南合作</option></select></label><label>地区<input placeholder="例如：北宁 / 平阳 / 胡志明"></label></div><div class="row"><label>面积/规模<input placeholder="例如：3000㎡"></label><label>预算/价格<input placeholder="可填面议"></label></div><label>具体需求<textarea placeholder="用途、时间、行业、园区要求、物流要求、合作方式等"></textarea></label><div class="row"><label>联系人<input placeholder="姓名/公司"></label><label>联系方式<input placeholder="电话 / WhatsApp / 微信 / Zalo / 邮箱"></label></div><button type="button" id="preview">生成需求摘要</button><p class="note">当前页面不自动提交身份或敏感资料。正式后台接口接入后再启用发送。</p><pre id="out" style="white-space:pre-wrap;background:#eef5f3;padding:12px;border-radius:9px"></pre></form></main><script>document.getElementById('preview').addEventListener('click',()=>{const f=document.getElementById('lead');const vals=[...f.querySelectorAll('input,select,textarea')].map(x=>x.value.trim());document.getElementById('out').textContent='需求摘要已在本机页面生成。请确认内容后再通过正式联系渠道提交。\n'+vals.filter(Boolean).join(' · ')})</script></body></html>
