name: Build and smoke test website factory

on:
  push:
    paths:
      - 'data/listings.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/factory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit and smoke tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
      - name: Generate static discovery files and pages
        run: python scripts/generate_site.py --languages zh
      - name: Health check generated site
        run: python scripts/health_check.py
      - name: Preserve generated preview for human review
        uses: actions/upload-artifact@v4
        with:
          name: vietnamzichan-generated-preview
          path: |
            listings/
            sitemap.xml
            robots.txt
            .factory-generated.json
          if-no-files-found: error

  # No commit, push, deployment, paid call, or identity-bearing action occurs
  # here. Production deployment remains gated by the main-branch workflow.
