# Cloudflare Pages 现在是唯一的生产部署目标（2026-09-07 起）。
# Netlify 账户因用量超限被暂停，且不应再自动触发部署，所以这个工作流改成只能手动触发
# （Actions 页面里点 Run workflow），不会再跟着 push 到 main 自动跑。
name: Deploy to Netlify (manual only)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Netlify deployment credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is missing; production was not deployed."
            exit 1
          fi
      - uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Auto deploy from GitHub Actions'
          enable-pull-request-comment: false
          enable-commit-comment: false
          overwrites-pull-request-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ecb4a907-4fda-43c0-b574-0f6b792ce1c2
