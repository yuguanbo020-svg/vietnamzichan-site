<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · VietnamZiChan</title>
    <link rel="canonical" href="https://vietnamzichan.com/zh/login/" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="/assets/site.css" />
    <link rel="stylesheet" href="/assets/community.css" />
    <style>
      main.auth{width:min(26rem,calc(100% - 3rem));margin:60px auto;display:grid;gap:20px}
      main.auth h1{margin:0;font-size:32px}
      .switch{font-size:13px;color:var(--muted)}
      .switch a{color:var(--green2);font-weight:700}
      .hint{font-size:12px;color:var(--muted)}
    </style>
  </head>
  <body>
    <div class="top"><div class="wrap"><span>Vietnam property intelligence · Sources retained · Verify before transaction</span><span class="lang"><a href="/zh/">中文</a><a href="/vi/">Tiếng Việt</a><a href="/en/">English</a></span></div></div><div class="nav-shell"><nav class="wrap nav"><a class="brand" href="/zh/">VietnamZiChan<small>越南资产网 · Vietnam Assets</small></a><div class="links"><a href="/zh/categories/factory/">工业地产</a><a href="/zh/cities/">城市</a><a href="/zh/listings/">资产列表</a><a href="/zh/opportunities/">合作机会</a><a href="/zh/trust/">案例与信任</a><a href="/zh/community/">社区</a></div><span class="auth-state" id="authState">加载中…</span><a class="action" href="/zh/contact/">提交询盘</a></nav></div>
    <main class="auth" data-auth-mode="login" data-auth-lang="zh">
      <h1>登录</h1>
      <p class="hint">通过邮件中的链接完成验证，无需密码或验证码。</p>
      <form class="community-form" id="emailAuthForm">

        <label class="hint" for="email">邮箱</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
        <button type="submit" id="sendLink">发送登录链接</button>
        <p class="msg" id="authMessage" role="status" aria-live="polite"></p>
      </form>
      <p class="switch">还没有账号？ <a href="/zh/signup/">注册</a></p>
    </main>
    <script type="module" src="/js/email-auth.js"></script>
  </body>
</html>
